services:
  freqtrade:
    image: freqtradeorg/freqtrade:stable_freqaitorch
    container_name: tredink-analysis-engine
    restart: unless-stopped
    environment:
      FREQTRADE__API_SERVER__USERNAME: ${TREDINK_API_USERNAME:-tredink}
      FREQTRADE__API_SERVER__PASSWORD: ${TREDINK_API_PASSWORD:-TredinkLocalOnly_ChangeMe_2026}
      FREQTRADE__API_SERVER__JWT_SECRET_KEY: ${TREDINK_JWT_SECRET:-change-this-local-jwt-secret}
      FREQTRADE__API_SERVER__WS_TOKEN: ${TREDINK_WS_TOKEN:-change-this-local-ws-token}
    volumes:
      - "./user_data:/freqtrade/user_data"
      - "./user_data/tredink.sample.json:/freqtrade/user_data/config_tredink.json:ro"
      - "./scripts/tredink_backtest_report.py:/app/tredink_backtest_report.py:ro"
    command: >
      trade
      --config /freqtrade/user_data/config_tredink.json
      --userdir /freqtrade/user_data
      --strategy TredinkForecastStrategy
      --freqaimodel LightGBMRegressor

  notifier:
    image: freqtradeorg/freqtrade:stable_freqaitorch
    container_name: tredink-telegram-notifier
    restart: unless-stopped
    entrypoint: ["python", "/app/notifier.py"]
    environment:
      TREDINK_API_URL: http://freqtrade:8080
      TREDINK_API_USERNAME: ${TREDINK_API_USERNAME:-tredink}
      TREDINK_API_PASSWORD: ${TREDINK_API_PASSWORD:-TredinkLocalOnly_ChangeMe_2026}
      TREDINK_TELEGRAM_BOT_TOKEN: ${TREDINK_TELEGRAM_BOT_TOKEN:-}
      TREDINK_TELEGRAM_CHAT_ID: ${TREDINK_TELEGRAM_CHAT_ID:-}
      TREDINK_PAIRS: ${TREDINK_PAIRS:-BTC/USDT,ETH/USDT,SOL/USDT,BNB/USDT}
      TREDINK_EQUITY_USDT: ${TREDINK_EQUITY_USDT:-1000}
      TREDINK_RISK_PER_TRADE: ${TREDINK_RISK_PER_TRADE:-0.005}
      TREDINK_MAX_POSITION_PCT: ${TREDINK_MAX_POSITION_PCT:-0.10}
      TREDINK_MAX_POSITION_USDT: ${TREDINK_MAX_POSITION_USDT:-50}
      TREDINK_MIN_EXPECTED_MOVE_PCT: ${TREDINK_MIN_EXPECTED_MOVE_PCT:-0.5}
      TREDINK_POLL_SECONDS: ${TREDINK_POLL_SECONDS:-900}
    volumes:
      - "./scripts/tredink_notifier.py:/app/notifier.py:ro"
      - "./user_data:/freqtrade/user_data"
    depends_on:
      - freqtrade

  dashboard:
    image: nginx:alpine
    container_name: tredink-dashboard
    restart: unless-stopped
    volumes:
      - "./tredink:/usr/share/nginx/html:ro"
      - "./tredink/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
    ports:
      - "127.0.0.1:8500:80"
    depends_on:
      - freqtrade
      - notifier
